apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'com.google.devtools.ksp'
apply plugin: 'org.jetbrains.kotlinx.kover'

android {
    compileSdk 37

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = '21'
    }

    defaultConfig {
        applicationId "com.app.dailylog"
        minSdkVersion 23
        targetSdkVersion 37
        versionCode 3103
        versionName "3.1.3"

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("KEYSTORE_PATH") ?: "placeholder.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: ""
            keyAlias System.getenv("KEY_ALIAS") ?: ""
            keyPassword System.getenv("KEY_PASSWORD") ?: ""
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            if (System.getenv("KEYSTORE_PATH")) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding = true
    }

    // Robolectric reads the tested variant's merged assets, not test assets, so the migration test needs the schemas here.
    sourceSets {
        debug.assets.srcDirs += files("$projectDir/schemas")
    }

    testOptions {
        unitTests {
            returnDefaultValues = true
            includeAndroidResources = true
            all {
                // Robolectric's Android 16 runtime needs this on JDK 21
                jvmArgs '--add-opens=java.base/jdk.internal.access=ALL-UNNAMED'
            }
        }
    }
    namespace 'com.app.dailylog'

    // F-Droid Requirement
    // Disables dependency metadata when building APKs and Android App Bundles
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }
}

ksp {
    arg("room.schemaLocation", "$projectDir/schemas")
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    api 'com.google.android.material:material:1.12.0'
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.6.2'
    implementation 'com.opencsv:opencsv:5.12.0'
    implementation 'com.google.code.gson:gson:2.14.0'

    // Room
    implementation 'androidx.room:room-runtime:2.8.5'
    implementation "androidx.room:room-ktx:2.8.5"
    androidTestImplementation "androidx.room:room-testing:2.8.5"
    testImplementation "androidx.room:room-testing:2.8.5"
    ksp "androidx.room:room-compiler:2.8.5"

    // Lifecycle components
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.2"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.6.2"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.6.2"

    // Test
    testImplementation('junit:junit:4.13.2')
    testImplementation 'org.mockito:mockito-core:5.24.0'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0'
    testImplementation 'org.robolectric:robolectric:4.17'
    testImplementation 'androidx.test:core-ktx:1.7.0'
    testImplementation 'androidx.test.ext:junit-ktx:1.3.0'
    testImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.test:core-ktx:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit-ktx:1.3.0'
    androidTestImplementation 'org.mockito:mockito-android:5.24.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}

kover {
    reports {
        filters {
            excludes {
                classes(
                    "com.app.dailylog.databinding.*",
                    "com.app.dailylog.repository.ShortcutDao_Impl*",
                    "com.app.dailylog.repository.ShortcutDatabase_Impl*",
                    "com.app.dailylog.ui.settings.ShortcutTouchHelper*",
                    "com.app.dailylog.ui.settings.ShortcutTouchViewHolder*",
                )
            }
        }
        verify {
            rule {
                bound {
                    minValue = 85
                }
            }
        }
    }
}