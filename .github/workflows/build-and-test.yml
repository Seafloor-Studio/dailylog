name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Reading the code is all either job does: the APK goes to an artifact, and the test report
# annotates through the log rather than the checks API. zizmor's excessive-permissions.
permissions:
  contents: read

jobs:
  build:
    name: Android CI
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: set up JDK 21
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle
        
    - name: Build
      run: ./gradlew build

    - name: Upload debug APK
      if: github.event_name == 'pull_request'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: dailylog-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 14
      
    - name: Unit Test
      run: ./gradlew testDebugUnitTest

    # Runs after failed steps too, so failing tests get reported; the job still fails from the step
    # that failed. annotate_only needs no checks: write, which PRs from forks don't get.
    - name: Unit test report
      if: ${{ !cancelled() }}
      uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6.5.0
      with:
        report_paths: 'app/build/test-results/**/TEST-*.xml'
        annotate_only: true

  instrumentation:
    name: Instrumentation tests (API ${{ matrix.api-level }})
    # The API 37.0 emulator crash-loops on ubuntu-24.04: issuetracker.google.com/issues/557246813
    runs-on: ${{ matrix.api-level == '37.0' && 'ubuntu-26.04' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        api-level: ['23', '36', '37.0']

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: set up JDK 21
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Run connected tests
      uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
      with:
        api-level: ${{ matrix.api-level }}
        # Google apps on the API 23 google_apis image crash at random, and the crash dialog steals focus.
        target: ${{ matrix.api-level == '23' && 'default' || 'google_apis' }}
        arch: x86_64
        # Sized for Android 17, which doesn't boot in 10 minutes or fit the test APKs on the
        # defaults. Logcat is recorded from boot so a crash before the tests still leaves a
        # log, and the tests wait for user storage to unlock before disabling animations.
        cores: 4
        ram-size: 4096M
        disk-size: 6000M
        emulator-boot-timeout: 900
        pre-emulator-launch-script: .github/scripts/record-emulator-logcat.sh
        disable-animations: false
        # The runner runs each line on its own and stops the emulator after the last, so the
        # failure report shares the test line to see the emulator as the tests left it.
        script: |
          .github/scripts/wait-for-emulator-unlock.sh
          for s in window_animation_scale transition_animation_scale animator_duration_scale; do adb shell settings put global $s 0.0; done
          ./gradlew connectedDebugAndroidTest || .github/scripts/print-emulator-failure.sh

    # Espresso saves a screenshot when a view check fails, which shows what had focus.
    - name: Upload emulator logcat and failure screenshots
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: emulator-logcat-api-${{ matrix.api-level }}
        path: |
          emulator-logcat.txt
          app/build/outputs/connected_android_test_additional_output/**
        if-no-files-found: ignore
